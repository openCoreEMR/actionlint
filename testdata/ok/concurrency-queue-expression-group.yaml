on:
  repository_dispatch:
    types: [chart-release]
  workflow_dispatch:
    inputs:
      chart:
        type: string
        required: true

# A per-chart group from an expression, queueing every run instead of letting
# a newer one cancel the one already waiting, the shape oce-ops-infra uses.
concurrency:
  group: chart-release-update-${{ github.event.client_payload.chart || inputs.chart }}
  queue: max
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: argocd-apply
      queue: max
      cancel-in-progress: false
    steps:
      - run: echo apply
